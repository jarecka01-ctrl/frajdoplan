# Repertuar kin studyjnych (Kijów, Mikro, Agrafka, Pod Baranami, Paradox, Sfinks) oraz wydarzenia dla dzieci
# (teatry, koncerty, domy kultury, biblioteki, hale i kluby z wydarzeniami gościnnymi: TAURON Arena, ICE, Klub Studio,
# Variété, Groteska, Teatr Figurki, Teatr Słowackiego, Opera Krakowska, KBF Bilety, Krakowskie Forum Kultury) → data/repertuar.json. Wynik uruchomienia (tabela źródeł i lista
# „do weryfikacji") jest w zakładce Summary uruchomienia.
# Wszystkie te kina mają tydzień repertuarowy piątek–czwartek i publikują go przed piątkiem
# (docs/rozpoznanie-kin.md), więc jeden harmonogram wystarcza dla wszystkich.
#
# Godziny w cron są w UTC. Podane niżej godziny polskie dotyczą czasu letniego;
# zimą (CET) wszystko przesuwa się o 1 h wcześniej (np. 21:00 → 20:00).
name: Repertuar kin i wydarzeń

on:
  schedule:
    - cron: '0 19 * * 2' # wtorek 21:00 — zwykle jest już repertuar na kolejny tydzień
    - cron: '0 19 * * 4' # czwartek 21:00 — ostatnie poprawki przed piątkiem
    - cron: '0 6 * * 6'  # sobota 8:00 — zmiany na weekend
  workflow_dispatch: # ręczne uruchomienie: Actions → Repertuar kin → Run workflow

permissions:
  contents: write

concurrency:
  group: repertuar-kin
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # kina + ok. 20 źródeł wydarzeń, 1 zapytanie na sekundę (samo Krakowskie Forum Kultury to ok. 300 zapytań, ~6 min)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Pobierz repertuar
        id: skrypt
        env:
          # adres do kontaktu w nagłówku User-Agent (zmienna albo sekret repozytorium); bez niego: „FrajdoplanBot"
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || secrets.CONTACT_EMAIL }}
          # adres CSV zakładki „Miejsca" (ten sam co w Vercel) — z niego bierzemy place_id kin, teatrów, domów kultury itd.; bez niego pole zostaje puste
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL || secrets.SHEET_CSV_URL }}
        run: |
          set +e
          node scripts/repertuar/uruchom.mjs
          echo "kod=$?" >> "$GITHUB_OUTPUT"

      # Zapis tylko przy zmianie pliku. Commit zrobiony tokenem GITHUB_TOKEN nie uruchamia ponownie
      # workflow (brak pętli), a Vercel wdroży nową wersję strony.
      # Obejmuje też wydarzenia (data/repertuar.json to jeden plik).
      # Tylko na gałęzi main: ręczne uruchomienie na innej gałęzi (próba nowego źródła) niczego nie commituje.
      - name: Zapisz zmiany
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/repertuar.json; then
            echo "Repertuar bez zmian."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repertuar.json
          git commit -m "Repertuar kin: aktualizacja"
          git push

      # Błąd któregoś źródła: plik ma jego poprzednie dane (ok: false), a workflow kończy się „failed",
      # więc GitHub wysyła e-mail do właścicielki repozytorium.
      - name: Sprawdź błędy źródeł
        if: steps.skrypt.outputs.kod != '0'
        run: |
          echo "::error::Co najmniej jedno źródło repertuaru nie zadziałało. Szczegóły w kroku „Pobierz repertuar”."
          exit 1
